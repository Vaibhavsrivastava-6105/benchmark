services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DEMO_MODE=true
      - DATABASE_URL=sqlite:////workspace/benchlab.db
    volumes:
      - benchlab_data:/workspace
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend
    restart: always

volumes:
  benchlab_data:

